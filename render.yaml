services:
  - type: web
    name: pricekenya
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # MUST be the www host. Cloudflare 301-redirects the apex to www for
      # every path, and base.html emits a self-referential canonical off the
      # request host — so it always said www. With BASE_URL on the apex,
      # every <loc> in the sitemap and the Sitemap: line in robots.txt
      # pointed at a URL that redirects: 2,553 of 2,553, which is the 1,214
      # "Page with redirect" in Search Console. Keep in step with the
      # BASE_URL in .github/workflows/sitemap.yml, which builds the same XML.
      - key: BASE_URL
        value: https://www.pricekenya.co.ke
      - key: SCRAPER_USER_AGENT
        value: PriceKenyaBot/0.1 (+https://pricekenya.co.ke)
      - key: SCRAPER_REQUEST_DELAY_SECONDS
        value: "2"
      - key: ALERTS_FROM_EMAIL
        value: PriceKenya Alerts <alerts@pricekenya.co.ke>
      - key: JUMIA_AFFILIATE_ID
        sync: false
      # Internal connection string, injected by Render on each Blueprint
      # sync. No credential in this file, in the dashboard field, or in a
      # transcript. app/config.py normalises the bare `postgresql://` scheme
      # that fromDatabase emits onto `postgresql+psycopg://` (PR #64), which
      # is what makes this value usable as-is.
      #
      # There is deliberately NO `databases:` block in this file. A
      # fromDatabase reference does not require one — "You can reference a
      # service that is not defined in your Blueprint file, but that service
      # must exist in your workspace" (render.com/docs/blueprint-spec). The
      # database already exists, was created outside any Blueprint, and
      # several of its fields are immutable; declaring it would buy nothing
      # and risk Render reconciling those fields. See
      # docs/render-blueprint-fromdatabase-assessment.md.
      #
      # `connectionString` is the PRIVATE-NETWORK URL. There is no property
      # that yields the external one, so the GitHub Actions DATABASE_URL
      # secret must stay a literal external string. Do not delete it.
      - key: DATABASE_URL
        fromDatabase:
          name: pricekenya-postgres
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      # Same shared secret as the /admin/* routes. Gates the /internal/scrape/
      # passthrough that GH Actions calls for Shopify merchants whose stores
      # block Azure DC IPs. Must match the ADMIN_KEY GitHub Actions secret.
      - key: ADMIN_KEY
        sync: false
